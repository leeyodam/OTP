worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # Upstreams — internal Docker network only
    upstream legacy_web {
        server legacy-web:5000;
    }

    upstream mfa_adapter {
        server mfa-adapter:5001;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        # Never trust client-supplied MFA bypass headers
        proxy_set_header X-2FA-Verified "";
        proxy_set_header X-MFA-User "";
        proxy_set_header X-Internal-MFA "";

        location = /mfa-auth {
            internal;
            proxy_pass http://mfa_adapter/internal/auth-check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-2FA-Verified "";
        }

        location /login {
            proxy_pass http://legacy_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /logout {
            proxy_pass http://mfa_adapter/logout;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
        }

        location /mfa/ {
            proxy_pass http://mfa_adapter;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /dashboard {
            auth_request /mfa-auth;
            error_page 401 = @needs_login;
            error_page 403 = @needs_mfa;
            proxy_pass http://legacy_web;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
        }

        location /api/protected {
            auth_request /mfa-auth;
            error_page 401 = @api_unauthorized;
            error_page 403 = @api_forbidden;
            proxy_pass http://legacy_web;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
        }

        location @needs_login {
            return 302 /login;
        }

        location @needs_mfa {
            return 302 /mfa/verify;
        }

        location @api_unauthorized {
            default_type application/json;
            return 401 '{"error":"unauthorized"}';
        }

        location @api_forbidden {
            default_type application/json;
            return 403 '{"error":"mfa_required"}';
        }

        location /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
}

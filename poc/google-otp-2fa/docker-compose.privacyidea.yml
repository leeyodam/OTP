# Overlay: privacyIDEA (open-source) via community Docker image + MFA_BACKEND=privacyidea
# Official privacyIDEA has no Docker Hub image; see privacyidea/README.md
# Usage: docker compose -f docker-compose.yml -f docker-compose.privacyidea.yml up --build

services:
  privacyidea:
    image: gpappsoft/privacyidea-docker:latest
    environment:
      PI_ADMIN: ${PRIVACYIDEA_ADMIN_USER:-admin}
      PI_ADMIN_PASS: ${PRIVACYIDEA_ADMIN_PASSWORD:-admin}
      PI_PEPPER: ${PI_PEPPER:-changeMePepperForPoC}
      PI_SECRET: ${PI_SECRET:-changeMeSecretForPoC}
      PI_ADDRESS: 0.0.0.0
      PI_PORT: "8080"
    networks:
      - internal
    volumes:
      - pi-data:/privacyidea/etc/persistent
    ports:
      - "127.0.0.1:18081:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/')",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  mfa-adapter:
    environment:
      MFA_BACKEND: privacyidea
      PRIVACYIDEA_URL: http://privacyidea:8080
      PRIVACYIDEA_ADMIN_USER: ${PRIVACYIDEA_ADMIN_USER:-admin}
      PRIVACYIDEA_ADMIN_PASSWORD: ${PRIVACYIDEA_ADMIN_PASSWORD:-admin}
      MFA_TEST_MODE: "false"
    depends_on:
      privacyidea:
        condition: service_healthy

volumes:
  pi-data:
